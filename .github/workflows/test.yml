name: IaC Quality & Security Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  static-analysis:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install cfn-lint checkov yamllint

      - name: Run YAML Linter
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, trailing-spaces: disable}}" .

      - name: Lint Shell Scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck *.sh

      - name: Run AWS CloudFormation Linter (cfn-lint)
        run: |
          cfn-lint -t ./*.yml --ignore-checks W

      - name: Run Checkov Security Scanner
        run: |
          checkov -d . --framework cloudformation --soft-fail

  template-validation:
    name: AWS API Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Validate CloudFormation Templates with AWS API
        run: |
          for file in *.yml *.yaml; do
            if [ -f "$file" ]; then
              echo "Validating $file..."
              aws cloudformation validate-template --template-body "file://$file"
            fi
          done

  integration-tests:
    name: Post-Deployment Health Check
    needs: [static-analysis, template-validation]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Install Test Dependencies
        run: |
          pip install pytest boto3 requests

      - name: Run Integration Tests
        run: |
          pytest tests/ -v
