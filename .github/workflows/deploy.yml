name: Deploy Enterprise Stacks

on:
  workflow_dispatch:

concurrency:
  group: aws-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Make Shell Scripts Executable
        run: chmod +x *.sh

      - name: Deploy Infrastructure Stack
        run: ./create-infra.sh

      - name: Deploy Compute and DB Stack
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          sed -i "s/KEY_PAIR_NAME=\"YourKeyPairName\"/KEY_PAIR_NAME=\"${{ secrets.EC2_KEY_PAIR_NAME }}\"/" create-vm-and-db.sh
          ./create-vm-and-db.sh

      - name: Run Integration Tests
        run: |
          pip install pytest boto3 requests
          pytest tests/ -v
